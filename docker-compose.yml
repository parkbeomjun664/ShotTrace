# MQTT 브로커. 📓 M16
#
#   docker compose up -d      켜기
#   docker compose down       끄기
#   docker compose logs -f    로그 보기
#
# 포트 매핑 "1883:1883" = 내 컴퓨터 : 컨테이너 안

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: shottrace-mosquitto
    restart: unless-stopped # 죽으면 다시 뜬다 (M28)
    ports:
      - "1883:1883"
    volumes:
      # 🔴 컨테이너를 지우면 안의 데이터도 사라진다. 설정은 내 폴더에 둔다.
      - ./mosquitto/config:/mosquitto/config
