# CI — 푸시할 때마다 테스트 118개를 기계가 돌린다 (Vitest 84 · pytest 12 · Playwright 22)
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:                                                  # 타입 검사 + Vitest 84 (lib/ 순수함수)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci                                     # package-lock 그대로 설치 — 내 PC 와 같은 버전
      - run: npx next typegen                           # 🔴 PageProps · LayoutProps 는 Next 가 만드는 타입 — 깨끗한 컴퓨터엔 .next/ 가 없다
      - run: npx tsc --noEmit
      - run: npm test

  python:                                               # pytest 12 (수집기 5 · ETL 7)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r services/collector/requirements.txt -r scripts/etl/requirements.txt -r requirements-dev.txt
      - run: pytest scripts/etl services/collector -v

  e2e:                                                  # Playwright 22 — viewer 로 · DB 에 아무것도 안 쓴다
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:                                                # 🔴 비밀은 코드가 아니라 GitHub Secrets 에서
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      VIEWER_PASSWORD: ${{ secrets.VIEWER_PASSWORD }}   # 둘러보기 계정 — 코드에 두지 않는다 (e2e/viewer.ts)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run e2e                                # playwright.config — 개발 서버를 스스로 띄운다 · runner 의 Chrome
      - uses: actions/upload-artifact@v4
        if: failure()                                   # 실패했을 때만 — 실패한 순간의 화면 기록을 남긴다
        with:
          name: playwright-results
          path: apps/web/test-results
